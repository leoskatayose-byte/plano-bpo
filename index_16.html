<title>Plano de Negócio · BPO Financeiro — LIDERE</title>
<style>

.logo{width:220px;height:auto;display:block}
.top-txt{flex:1;min-width:180px} .top-txt h1{margin:0;font-size:19px;letter-spacing:2px;font-weight:700;color:var(--gold);text-transform:uppercase;text-shadow:0 0 22px rgba(212,168,64,.35)}

.btn-gold:hover::after{left:140%} @keyframes goldPulse{0%,100%{box-shadow:0 4px 14px rgba(212,168,64,.28)}50%{box-shadow:0 4px 22px rgba(242,201,76,.5)}}

.stat .k{font-size:11px;letter-spacing:1.5px;color:var(--txt-mut);text-transform:uppercase;font-weight:700}

.progress>i{display:block;height:100%;border-radius:6px;position:relative;z-index:2;background:linear-gradient(90deg,#c99a2c,#f2c94c 82%,#fff6cc);box-shadow:0 0 12px 1px rgba(242,201,76,.55);transition:width .5s ease;width:0}
.progress.full{box-shadow:0 0 0 1px rgba(242,201,76,.45),0 0 22px rgba(242,201,76,.45)}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border:1px solid var(--line2);border-radius:12px;margin-bottom:9px;position:relative;overflow:hidden;transition:.2s;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}

@keyframes doneSweep{to{left:140%}}
.check{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--txt-mut);background:transparent;margin-top:2px;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:.15s}

.check svg{width:13px;height:13px;stroke:#06210f;fill:none;stroke-width:3.2;opacity:0} .check.on svg{opacity:1}
.check.pop{animation:pop .34s ease} @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.row-body{flex:1;min-width:0} .row-title{font-size:14.5px;font-weight:600;line-height:1.4}

.chip-estrutura{background:rgba(239,68,68,.14);color:#ff8f8f} .chip-executa{background:rgba(212,168,64,.14);color:var(--gold-l)} .chip-escala{background:rgba(62,160,107,.16);color:#6fd39b}

.iconbtn{border:1px solid var(--line2);background:transparent;color:var(--txt-mut);width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center} .iconbtn:hover{border-color:var(--gold);color:var(--gold-l)} .iconbtn.del:hover{border-color:var(--alta);color:#ff8080}

<!-- ===== GATE / LOGIN ===== -->
<div id="gate"><div class="gate-card">
  <div class="gate-logo" id="gateLogo"></div>
  <div id="gateBody"></div>
</div></div>

<!-- ===== APP ===== -->
<div class="wrap" id="app" style="display:none">
  <header class="top">
    <div class="logo-box"><div id="logoSlot"></div></div>
    <div class="top-txt"><h1>Plano de Negócio · BPO Financeiro</h1><p>Estrutura → Executa → Escala · do Societário à Squad · BPO Class</p></div>
    <div class="top-actions">
      <div class="faixa-wrap"><label>Minha faixa (MRR)</label><select id="faixaSel" onchange="setFaixa(this.value)"></select></div>
      <div class="acct"><div class="em">Conectado: <b id="acctEmail"></b></div>
        <div class="lnks"><a onclick="exportData()">Exportar dados</a><a onclick="openPrivacidade()">Privacidade</a><a onclick="logout()">Sair</a></div></div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="views"></main>
</div>

<div class="overlay" id="modal"><div class="modal">
  <div class="modal-head"><h3 id="modalTitle">Editar</h3><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-gold" id="modalSave">Salvar</button></div>
</div></div>

itulo": "Adaptar Contrato de Prestação de Serviços + LGPD", "instrucao": "USE O MODELO BPO CLASS DISPONÍVEL NA MENTORIA. Adapte: nome do escritório, CNPJ, escopo dos serviços, prazo, valor, forma de pagamento, reajuste (IPCA ou IGP-M), multa rescisória, cláusulas LGPD. Revise com advogado antes de usar com clientes.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "soc-09", "areaId": "soc", "codigo": "SOC-09", "titulo": "Definir e registrar endereço fiscal", "instrucao": "Opções: (a) Residencial: possível para MEI/ME, verifique com prefeitura. (b) Coworking: ~R$200-500/mês com endereço fiscal incluso. (c) Escritório compartilhado. O endereço consta no contrato social e nas NFs emitidas.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "soc-10", "areaId": "soc", "codigo": "SOC-10", "titulo": "Configurar sistema de emissão de NFS-e na Prefeitura", "instrucao": "Acesse o portal da prefeitura e ative o módulo de NFS-e. Configure ISS conforme regime tributário. IMPORTANTE: emita NF para TODOS os clientes desde o primeiro recebimento — é obrigação legal e transmite profissionalismo.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "soc-11", "areaId": "soc", "codigo": "SOC-11", "titulo": "Definir regime tributário com contador parceiro", "instrucao": "Simples Nacional Anexo III: recomendado para início (alíquota ~6% para BPO/consultoria). Analise anualmente se ainda é o melhor. Um contador parceiro pode fazer esse planejamento tributário com você.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "soc-12", "areaId": "soc", "co KT-03", "titulo": "Criar e otimizar perfil no LinkedIn", "instrucao": "Foto profissional, banner com proposta de valor. Headline: 'BPO Financeiro para [nicho] | Gestão Financeira Terceirizada'. Resumo: 3 parágrafos. Conecte-se com 10 pessoas do ICP por dia.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-04", "areaId": "mkt", "codigo": "MKT-04", "titulo": "Montar lista de 50 prospects qualificados", "instrucao": "Pesquise no Google Maps, LinkedIn (filtro cargo + setor), Instagram (hashtags do nicho). Preencha na PLANILHA CRM BPO CLASS: Nome do responsável, empresa, WhatsApp, Instagram, LinkedIn, fonte, status da abordagem.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-05", "areaId": "mkt", "codigo": "MKT-05", "titulo": "Criar script de abordagem no WhatsApp (3 mensagens)", "instrucao": "MSG 1: 'Oi [Nome], tudo bem? Vi seu [negócio] no Instagram. Sou [nome], BPO Financeiro para [nicho] em [cidade].' MSG 2 (D+1): 'Trabalho com [nichos similares]. Muitos chegam sem saber o lucro real. Isso acontece aí?' MSG 3 (D+3): 'Tenho diagnóstico de 15min que pode mudar sua visão do financeiro. Quando teria um espaço?'", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-06", "areaId": "mkt", "codigo": "MKT-06", "titulo": "Criar e lançar produto Raio-X Financeiro (R$497) — esteira de entrada", "instrucao": "O Raio-X é seu low ticket para converter para BPO (high ticket). Entregue: diagnóstico completo em 72h (planilha + gráfico radar + parecer escrito + call 30min). Checkout: Hotmart, Yampi ou link de pagamento. Pós-venda: oferte o BPO.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-07", "areaId": "mkt", "codigo": "MKT-07", "titulo": "Publicar conteúdo educativo — 3x por semana", "instrucao": "Segunda: Dica financeira para [nicho]. Quarta: Erro que empresários cometem. Sexta: Bastidores do BPO ou case (anônimo). Use Canva para artes. Instagram: carrossel 7 slides. LinkedIn: texto longo + imagem.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-08", "areaId": "mkt", "codigo": "MKT-08", "titulo": "Ativar networking presencial (meta: 1 evento/mês)", "instrucao": "Onde ir: CDL local, Associação Comercial, eventos do CRC, BNI, Rotary, câmaras setoriais do nicho. Leve cartão de visita. Pitch 30s pronto. Meta por evento: 5 novas conexões no WhatsApp.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-09", "areaId": "mkt", "codigo": "MKT-09", "titulo": "Configurar Google Meu Negócio", "instrucao": "business.google.com: preencha nome, categoria ('Serviço de Contabilidade'), endereço, telefone, horário. Adicione fotos profissionais. Solicite avaliações de contatos de confiança. Responda todos os comentários.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-10", "areaId": "mkt", "codigo": "MKT-10", "titulo": "Criar site profissional (até atingir R$15k MRR)", "instrucao": "Plataformas: WordPress + Elementor, Webflow ou Wix. Páginas: Home (hero + CTA Raio-X), Serviços, Sobre, Blog, Contato. SEO básico + Google Analytics. O site não vende — ele valida. Priorize prospecção ativa primeiro.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-11", "areaId": "mkt", "codigo": "MKT-11", "titulo": "Criar isca digital para captação de leads", "instrucao": "Exemplos: 'Checklist Financeiro para Clínicas', '7 Erros Financeiros de Advogados', 'Guia de Fluxo de Caixa para E-commerce'. Distribua no Instagram (link na bio) e LinkedIn. Capture e-mail para sequência de nutrição.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-12", "areaId": "mkt", "codigo": "MKT-12", "titulo": "Iniciar tráfego pago — Meta Ads", "instrucao": "Budget inicial: R$30-50/dia. Objetivo: Conversas no WhatsApp ou Leads. Audiência: empresários do nicho na sua cidade. Criativo: problema (caos financeiro) → solução (Raio-X R$497 ou consulta gratuita 15min). Teste 2-3 criativos/semana.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-13", "areaId": "mkt", "codigo": "MKT-13", "titulo": "Criar sequência de e-mail marketing (5 e-mails automatizados)", "instrucao": "E1: Boas-vindas + isca. E2 (D+2): Dor do nicho. E3 (D+4): Como o BPO resolve. E4 (D+6): Case de resultado. E5 (D+9): CTA para agendar Raio-X. Ferramentas: Mailchimp (grátis até 500) ou RD Station.", "faixa": "Até R$50k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-14", "areaId": "mkt", "codigo": "MKT-14", "titulo": "Implementar programa de indicações (referral)", "instrucao": "Mecânica: cliente ativo que indicar novo cliente fechado recebe 1 mês com 20% de desconto OU R$200 de crédito no BPO. Comunique para toda a base ativa. Meta: 30% dos novos clientes via indicação após 6 meses.", "faixa": "Até R$50k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-15", "areaId": "mkt", "codigo": "MKT-15", "titulo": "Contratar ou terceirizar produção de conteúdo", "instrucao": "A partir de R$30k MRR: delegue social media (~R$1.000-1.500/mês freelancer). Crie briefing mensal. Você aprova. Mantenha autenticidade — grave você mesmo nos Stories (bastidores, dicas rápidas).", "faixa": "Até R$50k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "mkt-16", "areaId": "mkt", "codigo": "MKT-16", "titulo": "Desenvolver estratégia de vídeos curtos (Reels/YouTube)", "instrucao": "Formato curto 30-90s: dicas financeiras para o nicho. YouTube 10-15min: cases, como funciona o BPO, explicação de DRE. Meta: 1 vídeo/semana. Maior alcance orgânico atual.", "faixa": "Acima R$100k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-01", "areaId": "com", "codigo": "KIT-01", "titulo": "Personalizar Apresentação Comercial do escritório", "instrucao": "USE O MODELO DE APRESENTAÇÃO BPO CLASS disponível na mentoria. Adapte: nome do escritório, logo, cores, nicho(s) de atuação, diferenciais, proposta de valor, cases (anônimos no início), depoimentos. A apresentação é usada na reunião comercial e enviada por e-mail.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "concluido", "observacoes": ""}, {"id": "kit-02", "areaId": "com", "codigo": "KIT-02", "titulo": "Adaptar e personalizar Proposta Comercial", "instrucao": "USE O MODELO DE PROPOSTA BPO CLASS. Adapte: logomarca, cores, escopo dos pacotes, valores, condições de pagamento, garantias, próximos passos. A proposta deve ser enviada em PDF dentro de 24h após a reunião comercial. Crie versões por nicho.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-03", "areaId": "com", "codigo": "KIT-03", "titulo": "Preencher Planilha de Precificação dos Serviços", "instrucao": "USE A PLANILHA DE PRECIFICAÇÃO BPO CLASS. Preencha: horas técnicas por pacote, custo hora (pró-labore + overhead), impostos, margem desejada (mínimo 40%). Calcule preços mínimos e preços de venda dos pacotes Básico, Intermediário e Premium.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-04", "areaId": "com", "codigo": "KIT-04", "titulo": "Definir e documentar seus Planos e Pacotes de Serviços", "instrucao": "USE O MODELO DE PLANO E PACOTES BPO CLASS. Defina 3 pacotes: Básico (R$1.500-3.000), Intermediário (R$3.000-6.000), Premium (R$6.000-15.000). Especifique EXATAMENTE o que inclui e o que NÃO inclui em cada pacote. Evite escopo aberto.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-05", "areaId": "com", "codigo": "KIT-05", "titulo": "Configurar Planilha CRM de Prospecção", "instrucao": "USE A PLANILHA CRM BPO CLASS. Configure colunas: Nome | Empresa | WhatsApp | Nicho | Status (Prospect/Contato/Qualificado/Reunião/Proposta/Fechado/Perdido) | Próxima ação | Data | Valor. Meta semanal: 10 novos contatos, 3 reuniões.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-06", "areaId": "com", "codigo": "KIT-06", "titulo": "Preencher Playbook de ICP — Perfil de Cliente Ideal", "instrucao": "USE O PLAYBOOK DE ICP BPO CLASS. Documente: segmento/nicho escolhido, faturamento ideal do cliente, cargo do decisor, dores financeiras específicas, objeções comuns e como quebrá-las, canais de prospecção mais eficazes, script de abordagem personalizado.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-07", "areaId": "com", "codigo": "KIT-07", "titulo": "Criar Estrutura de Processos Comerciais documentada", "instrucao": "USE O MODELO DE ESTRUTURA DE PROCESSOS BPO CLASS. Documente o funil completo: prospecção → qualificação → reunião → proposta → follow-up → fechamento → onboarding. Defina responsáveis, prazos e critérios de passagem entre etapas.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-08", "areaId": "com", "codigo": "KIT-08", "titulo": "Criar Política de Parcerias + Termo de Parceria", "instrucao": "USE O MODELO DE POLÍTICA DE PARCERIAS BPO CLASS. Defina: critérios para parceiro (contador, advogado, consultor), percentual de comissão (15-20% do MRR do cliente indicado), prazo de vigência, regras de rescisão. Formalize com assinatura digital antes de qualquer indicação.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "kit-09", "areaId": "com", "codigo": "KIT-09", "titulo": "Montar Apresentação de Parceria (contadores e advogados)", "instrucao": "USE O MODELO DE APRESENTAÇÃO DE PARCERIA BPO CLASS. Adapte para o perfil do parceiro: 'Como você pode agregar valor ao seu cliente e ainda gerar receita extra?'. Inclua: como funciona a parceria, exemplos de valor entregue ao cliente final, condições e comissão.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-10", "areaId": "com", "codigo": "COM-10", "titulo": "Dominar o script de qualificação SPIN Selling", "instrucao": "S — Situação: 'Como gerenciam o financeiro hoje? Qual sistema? Quantas contas bancárias?' P — Problema: 'O que mais te preocupa? Sabe exatamente o lucro todo mês?' I — Implicação: 'Esse caos já custou quanto?' N — Necessidade: 'Se tivesse relatório preciso, o que mudaria?' → Feche para o Raio-X.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-11", "areaId": "com", "codigo": "COM-11", "titulo": "Usar Raio-X Financeiro como esteira para o BPO", "instrucao": "Script pós-entrega: 'Com base no diagnóstico, identifiquei [3 problemas]. Para resolver definitivamente preciso acessar o financeiro de forma contínua — isso é exatamente o BPO Financeiro. Posso apresentar?' Meta de conversão: >40% Raio-X → BPO.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-12", "areaId": "com", "codigo": "COM-12", "titulo": "Criar roteiro de reunião de apresentação comercial (45min)", "instrucao": "Abertura 3min: 'Posso gravar?' + rapport. SPIN Selling 15min. Apresentação da Jornada do Cliente 10min. Prova social 5min (cases anônimos). Proposta e investimento 7min. CTA e próximos passos 5min. Envie proposta em até 24h.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-13", "areaId": "com", "codigo": "COM-13", "titulo": "Criar fluxo de follow-up estruturado (5 toques)", "instrucao": "T1 (D+0): 'Obrigado! Envio proposta até amanhã.' T2 (D+1): Envio da proposta. T3 (D+3): 'Teve oportunidade de ver?' T4 (D+7): Artigo/case relevante + gancho. T5 (D+14): 'Seguiu com outra solução ou ainda avaliando?'", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-14", "areaId": "com", "codigo": "COM-14", "titulo": "Implementar processo de upsell para clientes BPO ativos", "instrucao": "Gatilhos: 3 meses de BPO → oferte Consultoria Estratégica. Crescimento rápido → CFO as a Service. Expansão → Planejamento Financeiro. Script: 'Analisando seus números, identifiquei oportunidade de [X]. Posso mostrar?' Faça na call mensal.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-15", "areaId": "com", "codigo": "COM-15", "titulo": "Incluir serviços de consultoria no portfólio (diversificação)", "instrucao": "A partir de R$20k MRR: 1. Consultoria de Implantação de Processos (R$5k-15k projeto). 2. CFO as a Service mensal (R$3k-20k/mês). 3. Treinamento equipe interna do cliente. 4. Valuation de empresa. Use a aba Portfólio para estruturar.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-16", "areaId": "com", "codigo": "COM-16", "titulo": "Criar processo formal de renovação e reajuste anual", "instrucao": "Mês 10 do contrato: envie carta de renovação. Reajuste: IPCA + 5% ou mínimo 10%. Reunião de review anual: mostre valor entregue (relatórios acumulados, decisões tomadas). Clientes que renovam satisfeitos = defensores da marca.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "com-17", "areaId": "com", "codigo": "COM-17", "titulo": "Implantar processo de SDR/BDR dedicado (pré-vendas)", "instrucao": "A partir de R$50k MRR: contrate SDR (R$2.500-4.000/mês + comissão). Meta SDR: 15 reuniões qualificadas/mês. Você (closer) foca só em fechar. Base: metodologia Receita Previsível. Ferramentas: Apollo, Ramper ou prospecção manual.", "faixa": "Acima R$100k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-01", "areaId": "imp", "codigo": "IMP-01", "titulo": "Pré-preencher Ata de Kickoff com dados do Mapeamento Comercial", "instrucao": "USE O MODELO DE ATA DE KICKOFF BPO CLASS. Antes da reunião, preencha com dados coletados na venda: razão social, CNPJ, responsáveis, sistemas utilizados, bancos, adquirentes, volume NF/mês, regime tributário, dores prioritárias. Isso evita perder tempo na reunião com dados básicos.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-02", "areaId": "imp", "codigo": "IMP-02", "titulo": "Personalizar modelo padrão de Ata de Kickoff para seu escritório", "instrucao": "USE O MODELO DE ATA BPO CLASS e adapte com: logo e identidade visual do escritório, campos específicos do seu nicho de atuação, seção de assinatura digital (DocuSign). Crie uma versão salva como template para reutilizar com cada novo cliente.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-03", "areaId": "imp", "codigo": "IMP-03", "titulo": "Criar e publicar SLA de Atendimento do escritório BPO", "instrucao": "Documente e comunique ao cliente: (1) Horário de atendimento (ex: seg-sex 8h-18h). (2) Tempo de resposta no WhatsApp (até 4h úteis). (3) Tempo de resposta por e-mail (até 24h úteis). (4) Como escalar urgências. (5) O que NÃO está coberto pelo atendimento. Inclua no Welcome Kit.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-04", "areaId": "imp", "codigo": "IMP-04", "titulo": "Criar SLA de Entrega de Relatórios e Fechamento mensal", "instrucao": "Documente: (1) Data máxima para cliente enviar documentos (todo dia 3). (2) Prazo de processamento após recebimento (5 dias úteis). (3) Data de envio do relatório mensal (até dia 12). (4) Data da call mensal (entre dias 13-20). Comunique ao cliente no kickoff e formalize na ata.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-05", "areaId": "imp", "codigo": "IMP-05", "titulo": "Agendar Reunião de Kickoff com todos os participantes", "instrucao": "Participantes obrigatórios: Comercial (quem vendeu) + Analista Responsável BPO + Cliente (responsável financeiro). Opcionais: sócio do cliente, contador externo. Confirme por WhatsApp e e-mail. Envie pauta com antecedência de 24h.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-06", "areaId": "imp", "codigo": "IMP-06", "titulo": "Definir Cronograma de Ativações (até 48h após kickoff)", "instrucao": "Com base nas informações do kickoff, monte o cronograma: Semana 1 = acessos e ativações. Semana 2 = parametrização do sistema. Semana 3 = processamento inicial e treinamento. Semana 4 = primeiro relatório de validação. Compartilhe com cliente e equipe.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-07", "areaId": "imp", "codigo": "IMP-07", "titulo": "Conduzir Reunião de Kickoff (script 60-90min)", "instrucao": "1. Pedir permissão para gravar. 2. Apresentar equipe do BPO. 3. Apresentar Jornada do Cliente. 4. Validar escopo (o que SERÁ feito e o que NÃO será). 5. Alinhar objetivos e resultados esperados. 6. Coletar acessos. 7. Definir próximos passos com datas. 8. Assinar ata.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-08", "areaId": "imp", "codigo": "IMP-08", "titulo": "Enviar Ata de Kickoff + Contrato para assinatura digital", "instrucao": "Após validar mapeamento, envie Ata + Contrato via DocuSign (gratuito até 3/mês) ou Click Sign (~R$69/mês). REGRA: sem contrato assinado = sem início da operação. Prazo para assinatura: 48h.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-09", "areaId": "imp", "codigo": "IMP-09", "titulo": "Enviar E-mail de Boas-Vindas (até 24h após kickoff)", "instrucao": "Conteúdo: nome do analista responsável + contato direto, link da pasta Google Drive, lista de documentos necessários no 1º mês, data do primeiro relatório, canal de comunicação (WhatsApp do grupo). Anexe Welcome Kit PDF.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-10", "areaId": "imp", "codigo": "IMP-10", "titulo": "Ativar Canal de Comunicação no WhatsApp", "instrucao": "Crie grupo: '[Escritório] × [Cliente]'. Participantes: Analista + Gestor BPO + Responsável financeiro do cliente. Defina regras no primeiro envio: horário de atendimento, canal para documentos vs. dúvidas, tempo de resposta padrão (SLA).", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-11", "areaId": "imp", "codigo": "IMP-11", "titulo": "Criar e compartilhar pasta Google Drive estruturada", "instrucao": "Estrutura: [CLIENTE] > 01_Contratos | 02_Extratos_Bancários | 03_Notas_Fiscais | 04_Relatórios | 05_Atas | 06_Documentos_Gerais. Cliente: permissão Leitor. Equipe: permissão Editor.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-12", "areaId": "imp", "codigo": "IMP-12", "titulo": "Ativar e validar acesso bancário (visualizador)", "instrucao": "Solicite acesso de 'Visualizador' na conta bancária (adicionar e-mail BPO como usuário extra). Alternativa: Open Finance. Valide: consegue ver extratos, lançamentos e saldo? Armazene credenciais no cofre seguro (Bitwarden).", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-13", "areaId": "imp", "codigo": "IMP-13", "titulo": "Ativar e validar acesso às adquirentes (maquininhas)", "instrucao": "Stone, Cielo, Rede, PagSeguro, Getnet, Mercado Pago. Solicite acesso ao portal web. Alternativa: cliente exporta relatório mensal. Valide: consegue baixar extrato com data, valor bruto, taxa, líquido, NSU, bandeira?", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-14", "areaId": "imp", "codigo": "IMP-14", "titulo": "Ativar e validar acesso ao sistema financeiro do cliente", "instrucao": "Nibo: Configurações > Usuários > Convidar. ContaAzul: Config > Usuários. Omie: Admin > Usuários. NUNCA use o login do cliente — crie acesso nominado para o BPO. Perfil: Operador (lançamento) ou Administrador.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-15", "areaId": "imp", "codigo": "IMP-15", "titulo": "Ativar acesso ao sistema de NFSe na Prefeitura", "instrucao": "Solicite ao cliente acesso ao portal da prefeitura para emissão de NFS-e. Cadastre usuário BPO. Valide que consegue emitir nota de teste. Importante para clientes que querem que o BPO faça o faturamento deles.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-16", "areaId": "imp", "codigo": "IMP-16", "titulo": "Solicitar e Ativar Certificado Digital da empresa (A1 ou A3)", "instrucao": "Solicite ao cliente o Certificado Digital (A1 = arquivo/senha, A3 = token físico). Necessário para: emissão de NF-e (produtos), acesso a portais governamentais, assinatura digital. Verifique validade — normalmente 1 ou 3 anos.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-17", "areaId": "imp", "codigo": "IMP-17", "titulo": "Solicitar Planilha de Produtos/Serviços para importação no sistema", "instrucao": "Peça ao cliente planilha ou lista com: código do produto/serviço, descrição, unidade, preço de venda, NCM (produtos), CEST, tributação. Necessário para configurar NF-e e NFS-e no sistema. Solicite ao contador do cliente as regras fiscais.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-18", "areaId": "imp", "codigo": "IMP-18", "titulo": "Solicitar Planilha de Cadastro de Clientes e Fornecedores", "instrucao": "Peça lista com: CNPJ/CPF, razão social, contato, e-mail, dados bancários (fornecedores). Importe no sistema (Nibo/ContaAzul/Omie têm importação via planilha). Priorize os 10 clientes e 10 fornecedores mais recorrentes.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-19", "areaId": "imp", "codigo": "IMP-19", "titulo": "Solicitar, validar e importar Contas a Pagar (CP histórico)", "instrucao": "Peça planilha de CP em aberto: fornecedor, vencimento, valor, status (pago/em aberto). Importe no sistema. Separe gastos eventuais de gastos recorrentes. Mapeie gastos recorrentes no sistema de tarefas (Trello/PlayBPO) para não perder vencimentos.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-20", "areaId": "imp", "codigo": "IMP-20", "titulo": "Solicitar, validar e importar Contas a Receber (CR histórico)", "instrucao": "Peça planilha de CR em aberto: cliente, vencimento, valor, status. Importe no sistema. Identifique inadimplentes e já sinalize ao cliente. Esse levantamento mostra o real fluxo de caixa da empresa.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-21", "areaId": "imp", "codigo": "IMP-21", "titulo": "Ativar e validar Plano de Contas no sistema", "instrucao": "Configure o Plano de Contas adequado ao nicho do cliente. Use o template por nicho BPO Class. Categorias mínimas: Receitas Operacionais, CMV, Despesas Pessoal, Despesas Admin, Despesas Financeiras, Impostos. Evite categorias genéricas como 'Outros'.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-22", "areaId": "imp", "codigo": "IMP-22", "titulo": "Ativar e configurar Contas Correntes no sistema", "instrucao": "Cadastre todas as contas bancárias do cliente no sistema (conta corrente, poupança, investimentos, caixinha). Preencha saldo inicial com data de corte definida. Configure para conciliação bancária.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-23", "areaId": "imp", "codigo": "IMP-23", "titulo": "Ativar Gestão de Processos — configurar Planilha BPO Class", "instrucao": "USE A PLANILHA DE GESTÃO DE PROCESSOS DA OPERAÇÃO disponível na mentoria. Configure com os dados do novo cliente: nome, sistema, processos ativos, responsável analista, calendário de entregas. Essa planilha é o painel de controle da operação de cada cliente.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-24", "areaId": "imp", "codigo": "IMP-24", "titulo": "Definir Escopo do Treinamento + Agendar com o Cliente", "instrucao": "Defina o que será treinado: como enviar documentos, como usar o sistema (se cliente tem acesso), como interpretar relatórios, régua de cobrança. Agende com o responsável financeiro do cliente. Grave o treinamento e disponibilize na pasta Drive.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-25", "areaId": "imp", "codigo": "IMP-25", "titulo": "Enviar Ata do Treinamento por e-mail", "instrucao": "Após o treinamento, envie e-mail com: pontos tratados, responsabilidades do cliente vs. responsabilidades do BPO, próximas etapas, link da gravação. Arquive na pasta 05_Atas do Drive do cliente.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-26", "areaId": "imp", "codigo": "IMP-26", "titulo": "Definir Política de Inadimplência e Régua de Cobrança com o cliente", "instrucao": "Alinhe com o cliente: (1) Quantos dias de atraso para iniciar cobrança? (2) Quem cobra — BPO ou cliente? (3) Régua: D+1 WhatsApp, D+7 e-mail formal, D+15 ligação, D+30 protesto. Formalize por e-mail para ter registro. Inclua nos POPs operacionais.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-27", "areaId": "imp", "codigo": "IMP-27", "titulo": "Definir Política de Pagamentos a Fornecedores + Ativar DDA", "instrucao": "Alinhe: (1) Quais fornecedores o BPO paga diretamente (com procuração)? (2) Quais o cliente paga? (3) Prazo limite para aprovação de pagamentos (ex: até D-1). (4) Ative DDA no banco para receber débitos automáticos. Formalize política por e-mail.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-28", "areaId": "imp", "codigo": "IMP-28", "titulo": "Definir Processo de Vendas e Faturamento no sistema", "instrucao": "Alinhe com o cliente o fluxo completo: venda → geração de NF → contas a receber → cobrança. Configure no sistema: forma de geração de NF (automática ou manual), templates de NF. Defina data de corte do faturamento mensal.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-29", "areaId": "imp", "codigo": "IMP-29", "titulo": "Enviar Pesquisa de Satisfação NPS da Implantação (30 dias após kickoff)", "instrucao": "30 dias após o kickoff: envie formulário Google com: 'De 0 a 10, qual a probabilidade de recomendar nosso BPO?' + 2 perguntas abertas: 'O que foi melhor?' e 'O que melhoraríamos?'. Ação por NPS: 0-6 = ligar em 24h, 7-8 = melhorar, 9-10 = pedir indicação.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-30", "areaId": "imp", "codigo": "IMP-30", "titulo": "Ligar para o cliente para avaliar ganhos e apontar produtividade", "instrucao": "Ligue (ou faça call de 20min) ao cliente após 45 dias para: (1) Ouvir avaliação da implantação. (2) Apresentar métricas de ganho: tempo economizado, erros evitados, visibilidade financeira. (3) Identificar oportunidades de melhoria. (4) Plantear upsell se pertinente.", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "imp-31", "areaId": "imp", "codigo": "IMP-31", "titulo": "Criar Welcome Kit digital profissional para novos clientes", "instrucao": "PDF 3-5 páginas: 'Como funciona seu BPO', 'Como enviar documentos mensais', 'O que esperar nos primeiros 90 dias', 'Seus relatórios mensais explicados', 'Canal de atendimento e SLAs'. Envie junto com e-mail de boas-vindas.", "faixa": "Até R$30k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-01", "areaId": "ope", "codigo": "OPE-01", "titulo": "Revisar e personalizar o POP da Operação Completa", "instrucao": "USE O POP DA OPERAÇÃO (Word) disponível na mentoria — ele contém todas as Instruções de Trabalho detalhadas. Sua tarefa: (1) Leia todo o documento. (2) Adapte campos com nome do escritório. (3) Ajuste para os sistemas que você usa (Nibo/ContaAzul/Omie). (4) Salve como POP-V1-[Escritório].docx.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-02", "areaId": "ope", "codigo": "OPE-02", "titulo": "Configurar Planilha de Gestão de Processos da Operação", "instrucao": "USE A PLANILHA DE GESTÃO DE PROCESSOS disponível na mentoria (criamos ontem). Configure: (1) Aba de clientes ativos com sistema e analista responsável. (2) Calendário de entregas mensais. (3) Status de cada etapa (captação, processamento, relatório, call). Mantenha atualizada semanalmente.", "faixa": "Pré-início", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-03", "areaId": "ope", "codigo": "OPE-03", "titulo": "Configurar Planilha de Tarefas por Cargo no BPO", "instrucao": "USE A PLANILHA DE TAREFAS POR CARGO disponível na mentoria. Configure as tarefas para cada cargo: Auxiliar, Assistente e Analista Financeiro BPO. Use como base para onboarding de novos colaboradores e para checklists mensais da equipe.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-04", "areaId": "ope", "codigo": "OPE-04", "titulo": "Criar Instruções de Trabalho (ITs) personalizadas por sistema", "instrucao": "USE O MODELO IT-FIN BPO CLASS. Adapte os ITs dos processos mais frequentes para os sistemas dos seus clientes: (1) Lançamento CP no [Nibo/ContaAzul/Omie]. (2) Lançamento CR. (3) Conciliação bancária. (4) Fechamento mensal. (5) Geração de relatórios. Meta: IT para os 5 processos prioritários.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-05", "areaId": "ope", "codigo": "OPE-05", "titulo": "Estabelecer rotina de captação de documentos (todo dia 3)", "instrucao": "Envie lembrete no grupo WhatsApp nos dias 1 e 3: '✅ Extratos bancários ✅ NFs de compra ✅ Comprovantes de pagamento ✅ Relatório da maquininha ✅ [documentos específicos do cliente]'. Crie modelo de mensagem personalizado por cliente. Documente no POP.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-06", "areaId": "ope", "codigo": "OPE-06", "titulo": "Processar Contas a Pagar (CP) — Lançamentos de despesas", "instrucao": "Siga o IT de CP do POP BPO Class: (1) Receba documentos. (2) Lance cada despesa: data, valor, fornecedor, categoria, conta bancária. (3) Classifique: fixa/variável, operacional/não operacional. (4) Verifique duplicatas. (5) Concilie com extrato. Prazo: até dia 8.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-07", "areaId": "ope", "codigo": "OPE-07", "titulo": "Processar Contas a Receber (CR) — Lançamentos de receitas", "instrucao": "Siga o IT de CR do POP BPO Class: (1) Lance todas as entradas. (2) Vincule à NF. (3) Classifique por centro de receita. (4) Reconcilie com extrato bancário. (5) Identifique inadimplentes. Atenção: separe adiantamentos e receitas diferidas.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-08", "areaId": "ope", "codigo": "OPE-08", "titulo": "Realizar Conciliação Bancária", "instrucao": "Siga o IT de Conciliação do POP BPO Class: Cruce lançamentos do sistema com extrato bancário. Investigue divergências. Use ferramenta de conciliação do sistema (Nibo/ContaAzul/Omie). Meta: conciliação 100% zerada. Prazo: até dia 10.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-09", "areaId": "ope", "codigo": "OPE-09", "titulo": "Realizar Conciliação de Cartões (adquirentes)", "instrucao": "Siga o IT de Conciliação de Cartões do POP BPO Class (e USE A PLANILHA DE CONCILIAÇÃO DE CARTÕES BPO Class): Cruce vendas PDV × relatório adquirente × repasses bancários. Verifique: taxas corretas (MDR)? Algum repasse não entrou? Chargebacks? Antecipações?", "faixa": "Até R$10k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-10", "areaId": "ope", "codigo": "OPE-10", "titulo": "Executar Checklist de Fechamento Mensal", "instrucao": "Siga o Checklist do POP BPO Class: ✅ Todos documentos recebidos ✅ CP e CR lançados ✅ Conciliação bancária zerada ✅ Conciliação de cartões feita ✅ DRE fechada ✅ DFC gerada ✅ Relatórios gerados e revisados ✅ Pasta Drive organizada. Somente após todos → libere para o cliente.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-11", "areaId": "ope", "codigo": "OPE-11", "titulo": "Criar e aplicar Checklist de QA (Qualidade) antes de enviar relatórios", "instrucao": "Antes de enviar qualquer relatório: ✅ DRE bate com extrato? ✅ Saldo sistema = saldo banco? ✅ Todas as categorias classificadas (sem 'Outros')? ✅ Revisado por segundo par de olhos? ✅ Período correto? ✅ Cabeçalho correto? Use a planilha de QA da Gestão de Processos.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-12", "areaId": "ope", "codigo": "OPE-12", "titulo": "Criar Plano de Contas padrão por nicho de cliente", "instrucao": "Desenvolva template de Plano de Contas para cada nicho que atende: Clínica Médica, Advocacia, Comércio Varejista, Tech/SaaS. Inclua: receitas operacionais, custos diretos, despesas pessoal, despesas admin, financeiras, impostos. Disponibilize para equipe.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-13", "areaId": "ope", "codigo": "OPE-13", "titulo": "Implantar sistema de gestão de tarefas da equipe (Trello/Asana)", "instrucao": "A partir de 5+ clientes: use Trello (gratuito) ou Asana. Cada cliente = projeto. Tarefas mensais recorrentes. Dashboard de acompanhamento: % entregues no prazo. KPI de equipe: taxa de entrega on-time > 95%.", "faixa": "Até R$50k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "ope-14", "areaId": "ope", "codigo": "OPE-14", "titulo": "Automatizar captação de extratos via Open Finance", "instrucao": "Configure Open Finance para os clientes que autorizam: extrato bancário llega automaticamente no sistema. Reduz erros de digitação e dependência do cliente para enviar documentos. Disponível nos sistemas Nibo, ContaAzul e Omie.", "faixa": "Acima R$100k", "prioridade": "escala", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "rep-01", "areaId": "rep", "codigo": "REP-01", "titulo": "Gerar e enviar relatório de Posição Financeira (CP/CR)", "instrucao": "Conteúdo mínimo: (1) Posição de caixa atual. (2) CP próximos 30 dias (aging). (3) CR em aberto (aging). (4) Fluxo de caixa projetado. Envie até dia 12 via Drive + WhatsApp. Formato: PDF visual com gráficos ou Excel editável.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "rep-02", "areaId": "rep", "codigo": "REP-02", "titulo": "Gerar e enviar DRE mensal", "instrucao": "Estrutura: Receita Bruta → (−) Deduções → Receita Líquida → (−) CMV → Margem Bruta → (−) Despesas Operacionais → EBITDA → (−) Depr. → EBIT → (−) Result. Financeiro → Lucro Líquido. Compare com mês anterior e mesmo mês do ano anterior.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "rep-03", "areaId": "rep", "codigo": "REP-03", "titulo": "Conduzir Vídeo/Call de Posição Mensal (30-60min)", "instrucao": "Pauta: (1) Review DRE + DFC. (2) Principais variações do mês. (3) Alertas e oportunidades. (4) Decisões necessárias (cliente decide, você apresenta dados). (5) Próximos passos acordados. Grave + envie link. Ata escrita em até 24h.", "faixa": "Até R$10k", "prioridade": "estrutura", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "rep-04", "areaId": "rep", "codigo": "REP-04", "titulo": "Gerar DFC — Demonstração do Fluxo de Caixa", "instrucao": "Método Direto: Entradas operacionais − Saídas operacionais = Fluxo Operacional + Investimentos + Financiamentos = Saldo final. Compare projetado vs. realizado. Fundamental para gestão de capital de giro e decisões de antecipação.", "faixa": "Até R$30k", "prioridade": "executa", "responsavel": "", "dataPlanejada": "", "dataRealizada": "", "status": "planejado", "observacoes": ""}, {"id": "rep-05", "areaId": "rep", "codigo": "REP-05", "titulo": "Criar dashboard financeiro visual para o cliente", "instrucao async function loadAll(){
  const [ar,ta,eq,pf,cf]=await Promise.all([
    sb.from('plano_areas').select('*').order('ordem'),
    sb.from('plano_tarefas').select('*').order('ordem'),
    sb.from('plano_equipe').select('*').order('ordem'),
    sb.from('plano_portfolio').select('*').order('ordem'),
    sb.from('plano_config').select('*').eq('id',1).maybeSingle()
  ]);
  const err=ar.error||ta.error||eq.error||pf.error;
  if(err){console.error(err);toast('⚠ Erro ao carregar dados');return}
  if(cf.data&&!cf.data.seeded&&(!ar.data||ar.data.length===0)){await seedCloud();return loadAll();}
  DB.areas=(ar.data||[]).map(a=>({id:a.id,nome:a.nome,icon:a.icon,ordem:a.ordem,deletedAt:a.deleted_at}));
  DB.tarefas=(ta.data||[]).map(t=>({id:t.id,areaId:t.area_id,codigo:t.codigo||'',titulo:t.titulo,instrucao:t.instrucao||'',faixa:t.faixa||'Pré-início',prioridade:t.prioridade||'executa',responsavel:t.responsavel||'',dataPlanejada:t.data_planejada||'',dataRealizada:t.data_realizada||'',status:t.status||'planejado',observacoes:t.observacoes||'',ordem:t.ordem,deletedAt:t.deleted_at}));
  DB.equipe=(eq.data||[]).map(e=>({id:e.id,cargo:e.cargo||'',faixa:e.faixa||'',qtd:e.qtd||'',tipo:e.tipo||'',remuneracao:e.remuneracao||'',responsabilidades:e.responsabilidades||'',habilidades:e.habilidades||'',prioridade:e.prioridade||'',ordem:e.ordem,deletedAt:e.deleted_at}));
  DB.portfolio=(pf.data||[]).map(p=>({id:p.id,produto:p.produto||'',tipo:p.tipo||'',ticket:p.ticket||'',inclui:p.inclui||'',faixaOferecer:p.faixa_oferecer||'',publico:p.publico||'',duracao:p.duracao||'',comoVender:p.como_vender||'',status:p.status||'',ordem:p.ordem,deletedAt:p.deleted_at}));

  DB.soAtivas=localStorage.getItem('plano_soativas')==='1';
  if(!DB.areas.some(a=>a.id===activeArea))activeArea=DB.areas.filter(a=>!a.deletedAt)[0]?.id||null;
}
async function seedCloud(){

  const arows=SEED.areas.map((a,i)=>{const id=uid();amap[a.id]=id;return{id,nome:a.nome,icon:a.icon,ordem:i+1}});
  await sb.from('plano_areas').insert(arows);
  const trows=SEED.tarefas.map((t,i)=>({id:uid(),area_id:amap[t.areaId],codigo:t.codigo,titulo:t.titulo,instrucao:t.instrucao||null,faixa:t.faixa,prioridade:t.prioridade,responsavel:t.responsavel||null,status:t.status,observacoes:t.observacoes||null,ordem:i+1}));
  await sb.from('plano_tarefas').insert(trows);
  await sb.from('plano_equipe').insert(SEED.equipe.map((e,i)=>({id:uid(),cargo:e.cargo,faixa:e.faixa,qtd:e.qtd,tipo:e.tipo,remuneracao:e.remuneracao,responsabilidades:e.responsabilidades,habilidades:e.habilidades,prioridade:e.prioridade,ordem:i+1})));
  await sb.from('plano_portfolio').insert(SEED.portfolio.map((p,i)=>({id:uid(),produto:p.produto,tipo:p.tipo,ticket:p.ticket,inclui:p.inclui,faixa_oferecer:p.faixaOferecer,publico:p.publico,duracao:p.duracao,como_vender:p.comoVender,status:p.status,ordem:i+1})));
  await sb.from('plano_config').update({seeded:true}).eq('id',1);
}

  if(id==='admin')return PROFILES.length||null;
  return null}
function renderTabs(){document.getElementById('tabs').innerHTML=baseTabs().map(t=>{const c=tabCount(t.id);
  return `<button class="tab ${activeTab===t.id?'active':''}" onclick="go('${t.id}')"><span>${t.icon}</span> ${t.label}${c!=null?`<span class="cnt">${c}</span>`:''}</button>`}).join('')}
function go(id){activeTab=id;render();if(id==='admin')adminLoad()}
function render(){
  document.getElementById('acctEmail').textContent=ME?ME.email:'';

/* ===== linha de tarefa ===== */
function taskChips(t){
  return `<span class="chip chip-code">${esc(t.codigo)}</span>`
   +`<span class="chip chip-${t.prioridade}">${PRI[t.prioridade].emoji} ${PRI[t.prioridade].label}</span>`
   +`<span class="chip chip-faixa">${esc(t.faixa)}</span>`
   +(t.responsavel?`<span class="chip chip-resp">👤 ${esc(t.responsavel)}</span>`:'')
   +(t.dataPlanejada?`<span class="chip chip-date">📅 Plan: ${fmtBR(t.dataPlanejada)}</span>`:'')
   +(t.dataRealizada?`<span class="chip chip-date">✔ Real: ${fmtBR(t.dataRealizada)}</span>`:'')}
function statusSelect(t){return `<select class="st-sel" data-st="${t.status}" onchange="setStatus('${t.id}',this.value)" onclick="event.stopPropagation()">`+Object.keys(STA).map(k=>`<option value="${k}" ${t.status===k?'selected':''}>${STA[k].emoji} ${STA[k].label}</option>`).join('')+`</select>`}
function taskRow(t){const inativo=!ativo(t)?'inativo':'';
  return `<div class="row ${isDone(t)?'done':''} ${inativo}" data-mid="${t.id}">
    <button class="check ${isDone(t)?'on':''}" onclick="toggleDone('${t.id}')" title="Marcar concluído">${svgCheck}</button>
    <div class="row-body"><div class="row-title">${esc(t.titulo)}</div>
      <div class="row-meta">${statusSelect(t)}${taskChips(t)}</div>
      ${t.instrucao?`<details class="instr"><summary>Instrução (Mini IT)</summary><div class="instr-txt">${esc(t.instrucao)}</div></details>`:''}
      ${t.observacoes?`<div class="obs">📝 ${esc(t.observacoes)}</div>`:''}</div>
    <div class="row-actions">
      <button class="iconbtn" onclick="moveTask('${t.id}',-1)" title="Subir">${iUp}</button>
      <button class="iconbtn" onclick="moveTask('${t.id}',1)" title="Descer">${iDown}</button>
      <button class="iconbtn" onclick="openTask('${t.id}')" title="Editar">${iEdit}</button>
      <button class="iconbtn del" onclick="delTask('${t.id}')" title="Excluir">${iTrash}</button></div></div>`}

/* ===== Painel ===== */
function viewPainel(){
  const all=scoped(alive(DB.tarefas));
  const done=all.filter(isDone).length, and=all.filter(t=>t.status==='andamento').length;
  const pend=all.length-done-and, pct=all.length?Math.round(done/all.length*100):0;
  const stats=[['Tarefas no plano',all.length,DB.soAtivas?'da sua faixa':'total'],['Concluídas',done,pct+'% do plano'],['Em andamento',and,''],['Pendentes',pend,'']];
  const areaCards=alive(DB.areas).map(a=>{const list=scoped(tarefasArea(a.id));const d=list.filter(isDone).length;const p=list.length?Math.round(d/list.length*100):0;
    return `<div class="acard" onclick="goArea('${a.id}')"><h3>${a.icon} ${esc(a.nome)}</h3>
      <div class="frac">${d} de ${list.length} concluídas · <b style="color:var(--gold-l)">${p}%</b></div>
      <div class="mini"><i style="width:${p}%"></i></div></div>`}).join('');
  return `<div class="stats">${stats.map(([k,v,s])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`).join('')}</div>
    <div class="panel"><div class="panel-head"><h2>🚀 Progresso geral</h2><span class="chip chip-faixa">Faixa: ${esc(DB.faixaAtual)}</span></div>
      <div class="progress"><i class="pbar" data-target="${pct}" data-main="1"></i></div>
      <div class="legend"><div><span class="dotp e"></span> 🔴 Estrutura — base obrigatória, faça primeiro</div>
      <div><span class="dotp x"></span> 🟡 Executa — crescer e operar com qualidade</div>
      <div><span class="dotp s"></span> 🟢 Escala — alavancagem e automação</div></div></div>
    <div class="panel"><div class="panel-head"><h2>🗂️ Progresso por área</h2></div><div class="areagrid">${areaCards}</div></div>
    <div class="panel"><div class="panel-head"><h2>📖 Como usar</h2></div>
      <div class="callout">1) Escolha sua <b>Faixa de Faturamento (MRR)</b> no topo — tarefas acima da sua faixa ficam esmaecidas (ative "Só da minha faixa" na aba Áreas para escondê-las).<br>
      2) Priorize <b>🔴 Estrutura</b> → <b>🟡 Executa</b> → <b>🟢 Escala</b>.<br>
      3) Atualize o <b>Status</b> (Planejado → Em Andamento → Concluído) e preencha responsável e datas.<br>
      4) <b>Tudo é editável e compartilhado na nuvem</b>: sua equipe vê os mesmos dados em tempo (ao recarregar). Use o lápis para editar, ＋ para novas etapas e ⚙️ para áreas.</div></div>`;
}

/* ===== Kanban ===== */
function viewKanban(){
  const areaOpts=`<option value="all">Todas as áreas</option>`+alive(DB.areas).map(a=>`<option value="${a.id}" ${kFilterArea===a.id?'selected':''}>${a.icon} ${esc(a.nome)}</option>`).join('');
  let list=scoped(alive(DB.tarefas));
  if(kFilterArea!=='all')list=list.filter(t=>t.areaId===kFilterArea);
  const board=Object.keys(STA).map(st=>{const items=list.filter(t=>t.status===st);

    return `<div class="kcol" data-st="${st}" ondragover="kOver(event)" ondragleave="kLeave(event)" ondrop="kDrop(event,'${st}')">
      <h3><span>${STA[st].emoji} ${STA[st].label}</span><span class="cnt">${items.length}</span></h3>${cards}</div>`}).join('');

      <span class="right callout" style="padding:8px 12px">Arraste os cartões entre as colunas para mudar o status.</span></div>
    <div class="kboard">${board}</div>`;
}
let _kDragId=null;
function kDrag(e,id){_kDragId=id;e.dataTransfer.effectAllowed='move';e.target.classList.add('drag')}
function kDragEnd(e){e.target.classList.remove('drag')}
function kOver(e){e.preventDefault();e.currentTarget.classList.add('over')}
function kLeave(e){e.currentTarget.classList.remove('over')}
function kDrop(e,st){e.preventDefault();e.currentTarget.classList.remove('over');if(!_kDragId)return;const t=DB.tarefas.find(x=>x.id===_kDragId);if(t&&t.status!==st){t.status=st;if(st==='concluido'){window._justPop=t.id;if(!t.dataRealizada)t.dataRealizada=new Date().toISOString().slice(0,10)}render();persistTarefa(t)}_kDragId=null}

/* ===== Mutações de tarefa ===== */
function toggleDone(id){const t=DB.tarefas.find(x=>x.id===id);if(!t)return;
  if(t.status==='concluido'){t.status='planejado'}else{t.status='concluido';window._justPop=id;if(!t.dataRealizada)t.dataRealizada=new Date().toISOString().slice(0,10)}render();persistTarefa(t)}
function setStatus(id,st){const t=DB.tarefas.find(x=>x.id===id);if(!t)return;t.status=st;if(st==='concluido'){window._justPop=id;if(!t.dataRealizada)t.dataRealizada=new Date().toISOString().slice(0,10)}render();persistTarefa(t)}
function delTask(id){const t=DB.tarefas.find(x=>x.id===id);if(!t)return;t.deletedAt=new Date().toISOString();render();persistTarefa(t);toast('Movido para Excluídos')}
function restoreTask(id){const t=DB.tarefas.find(x=>x.id===id);if(t){t.deletedAt=null;render();persistTarefa(t);toast('Restaurado')}}
function restoreAll(){DB.tarefas.filter(t=>t.deletedAt).forEach(t=>{t.deletedAt=null;persistTarefa(t)});render();toast('Tudo restaurado')}
function purgeTask(id){if(!confirm('Excluir esta tarefa definitivamente?'))return;DB.tarefas=DB.tarefas.filter(x=>x.id!==id);render();delRow('plano_tarefas',id)}
function moveTask(id,dir){const t=DB.tarefas.find(x=>x.id===id);if(!t)return;
  const sib=DB.tarefas.filter(x=>x.areaId===t.areaId&&!x.deletedAt).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
  const i=sib.indexOf(t), j=i+dir; if(j<0||j>=sib.length)return;
  const other=sib[j]; const o=t.ordem; t.ordem=other.ordem; other.ordem=o;
  render();persistTarefa(t);persistTarefa(other)}

/* ===== Modal / formulários ===== */
function fieldTxt(id,label,val,ph){return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(val||'')}" placeholder="${ph||''}"></div>`}
function fieldArea(id,label,val,ph){return `<div class="field"><label>${label}</label><textarea id="${id}" placeholder="${ph||''}">${esc(val||'')}</textarea></div>`}
function fieldSel(id,label,val,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function fieldDate(id,label,val){return `<div class="field"><label>${label}</label><input type="date" id="${id}" value="${esc((val||'').slice(0,10))}"></div>`}
function openModal(title,bodyHTML,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=bodyHTML;document.getElementById('modalSave').style.display='';document.getElementById('modalSave').onclick=onSave;document.getElementById('modal').classList.add('show');const f=document.querySelector('#modalBody input,#modalBody textarea,#modalBody select');if(f)setTimeout(()=>f.focus(),50)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
function nextOrdem(arr){return (arr.reduce((m,x)=>Math.max(m,x.ordem||0),0))+1}

function pickPri(p){curPri=p;document.querySelectorAll('#priPick .pri-opt').forEach(o=>o.classList.toggle('sel',o.dataset.p===p))}
function openTask(id,areaPref){
  const t=id?DB.tarefas.find(x=>x.id===id):null; curPri=t?t.prioridade:'estrutura';
  const areaOpts=alive(DB.areas).map(a=>[a.id,a.icon+' '+a.nome]);
  const faixaOpts=DB.faixas.map(f=>[f,f]);
  const staOpts=Object.keys(STA).map(k=>[k,STA[k].emoji+' '+STA[k].label]);
  const body=`${fieldTxt('f_titulo','Tarefa / Ação *',t?t.titulo:'','Descreva a etapa')}
    <div class="grid2">${fieldTxt('f_codigo','Código',t?t.codigo:'','ex: SOC-14')}
    ${fieldSel('f_area','Área',t?t.areaId:(areaPref||(alive(DB.areas)[0]||{}).id),areaOpts)}</div>
    <div class="field"><label>Prioridade</label><div class="pri-pick" id="priPick">
      <div class="pri-opt" data-p="estrutura" onclick="pickPri('estrutura')">🔴 Estrutura</div>
      <div class="pri-opt" data-p="executa" onclick="pickPri('executa')">🟡 Executa</div>
      <div class="pri-opt" data-p="escala" onclick="pickPri('escala')">🟢 Escala</div></div></div>
    <div class="grid2">${fieldSel('f_faixa','Faixa de Faturamento',t?t.faixa:DB.faixas[0],faixaOpts)}
    ${fieldSel('f_status','Status',t?t.status:'planejado',staOpts)}</div>
    ${fieldTxt('f_resp','Responsável',t?t.responsavel:'','Quem executa')}
    <div class="grid2">${fieldDate('f_dplan','Data Planejada',t?t.dataPlanejada:'')}
    ${fieldDate('f_dreal','Data Realizada',t?t.dataRealizada:'')}</div>
    ${fieldArea('f_instr','Instrução (Mini IT)',t?t.instrucao:'','Passo a passo / orientação')}
    ${fieldArea('f_obs','Observações',t?t.observacoes:'','Anotações')}`;
  openModal(t?'Editar tarefa':'Nova tarefa',body,()=>{
    const titulo=val('f_titulo');if(!titulo)return toast('Informe a tarefa');
    const data={titulo,codigo:val('f_codigo'),areaId:val('f_area'),prioridade:curPri,faixa:val('f_faixa'),status:val('f_status'),responsavel:val('f_resp'),dataPlanejada:val('f_dplan'),dataRealizada:val('f_dreal'),instrucao:val('f_instr'),observacoes:val('f_obs')};
    let obj;
    if(t){Object.assign(t,data);obj=t}else{obj=Object.assign({id:uid(),ordem:nextOrdem(DB.tarefas.filter(x=>x.areaId===data.areaId)),deletedAt:null},data);DB.tarefas.push(obj)}
    closeModal();render();persistTarefa(obj);toast('Salvo')});
  setTimeout(()=>pickPri(curPri),0);
}
function openArea(id){
  const a=id?DB.areas.find(x=>x.id===id):null;
  const body=`${fieldTxt('a_nome','Nome da área *',a?a.nome:'','ex: Jurídico')}${fieldTxt('a_icon','Ícone (emoji)',a?a.icon:'📁','📁')}${a?`<div class="callout">Excluir a área envia também as tarefas dela para a lixeira.</div>`:''}`;
  openModal(a?'Editar área':'Nova área',body,()=>{
    const nome=val('a_nome');if(!nome)return toast('Informe o nome');const icon=val('a_icon')||'📁';
    let obj;
    if(a){a.nome=nome;a.icon=icon;obj=a}else{obj={id:uid(),nome,icon,ordem:nextOrdem(DB.areas),deletedAt:null};DB.areas.push(obj);activeArea=obj.id}
    closeModal();activeTab='areas';render();persistArea(obj);toast('Salvo')});
  if(a)setTimeout(()=>{const foot=document.querySelector('.modal-foot');if(foot&&!document.getElementById('delAreaBtn')){const b=document.createElement('button');b.id='delAreaBtn';b.className='btn btn-ghost';b.style.marginRight='auto';b.style.color='#ff8080';b.textContent='Excluir área';b.onclick=()=>delArea(a.id);foot.prepend(b)}},0);
}
function delArea(id){const a=DB.areas.find(x=>x.id===id);if(!a)return;
  const ts=DB.tarefas.filter(t=>t.areaId===id&&!t.deletedAt);
  if(!confirm(`Excluir a área "${a.nome}"${ts.length?` e enviar suas ${ts.length} tarefa(s) para a lixeira`:''}?`))return;
  const now=new Date().toISOString();
  ts.forEach(t=>{t.deletedAt=now;persistTarefa(t)});
  a.deletedAt=now;persistArea(a);
  activeArea=alive(DB.areas)[0]?.id||null;closeModal();render();toast('Área excluída')}
function openEquipe(id){const e=id?DB.equipe.find(x=>x.id===id):null;
  const body=`${fieldTxt('e_cargo','Cargo / Perfil *',e?e.cargo:'')}
    <div class="grid2">${fieldTxt('e_faixa','Faixa MRR',e?e.faixa:'')}${fieldTxt('e_prioridade','Prioridade',e?e.prioridade:'')}</div>
    <div class="grid2">${fieldTxt('e_qtd','Qtd',e?e.qtd:'')}${fieldTxt('e_tipo','Tipo',e?e.tipo:'')}</div>
    ${fieldTxt('e_rem','Remuneração Ref.',e?e.remuneracao:'')}
    ${fieldArea('e_resp','Responsabilidades',e?e.responsabilidades:'')}${fieldArea('e_hab','Habilidades Necessárias',e?e.habilidades:'')}`;
  openModal(e?'Editar perfil':'Novo perfil',body,()=>{
    const cargo=val('e_cargo');if(!cargo)return toast('Informe o cargo');
    const data={cargo,faixa:val('e_faixa'),prioridade:val('e_prioridade'),qtd:val('e_qtd'),tipo:val('e_tipo'),remuneracao:val('e_rem'),responsabilidades:val('e_resp'),habilidades:val('e_hab')};
    let obj;if(e){Object.assign(e,data);obj=e}else{obj=Object.assign({id:uid(),ordem:nextOrdem(DB.equipe),deletedAt:null},data);DB.equipe.push(obj)}
    closeModal();render();persistEquipe(obj);toast('Salvo')});
}
function delEquipe(id){if(!confirm('Excluir este perfil?'))return;const e=DB.equipe.find(x=>x.id===id);DB.equipe=DB.equipe.filter(x=>x.id!==id);render();delRow('plano_equipe',id)}
function openPort(id){const p=id?DB.portfolio.find(x=>x.id===id):null;
  const body=`${fieldTxt('p_prod','Produto / Serviço *',p?p.produto:'')}
    <div class="grid2">${fieldTxt('p_tipo','Tipo',p?p.tipo:'')}${fieldTxt('p_ticket','Ticket',p?p.ticket:'')}</div>
    ${fieldArea('p_inclui','O que inclui',p?p.inclui:'')}
    <div class="grid2">${fieldTxt('p_faixa','Faixa p/ oferecer',p?p.faixaOferecer:'')}${fieldTxt('p_dur','Duração',p?p.duracao:'')}</div>
    ${fieldTxt('p_pub','Público-Alvo',p?p.publico:'')}${fieldArea('p_venda','Como Vender',p?p.comoVender:'')}${fieldTxt('p_status','Status',p?p.status:'')}`;
  openModal(p?'Editar produto':'Novo produto',body,()=>{
    const produto=val('p_prod');if(!produto)return toast('Informe o produto');
    const data={produto,tipo:val('p_tipo'),ticket:val('p_ticket'),inclui:val('p_inclui'),faixaOferecer:val('p_faixa'),duracao:val('p_dur'),publico:val('p_pub'),comoVender:val('p_venda'),status:val('p_status')};
    let obj;if(p){Object.assign(p,data);obj=p}else{obj=Object.assign({id:uid(),ordem:nextOrdem(DB.portfolio),deletedAt:null},data);DB.portfolio.push(obj)}
    closeModal();render();persistPort(obj);toast('Salvo')});
}
function delPort(id){if(!confirm('Excluir este produto?'))return;DB.portfolio=DB.portfolio.filter(x=>x.id!==id);render();delRow('plano_portfolio',id)}

/* ===== Privacidade / LGPD ===== */
function openPrivacidade(){
  const body=`<div class="callout" style="line-height:1.7">
    <b>Aviso de Privacidade (LGPD)</b><br>
    <b>Controlador:</b> ${esc(CONTROLADOR)}.<br>
    <b>Finalidade:</b> autenticar o acesso ao plano de negócio interno e registrar o progresso das tarefas da equipe.<br>
    <b>Dados coletados:</b> apenas o seu <b>e-mail</b> (para login e identificação). Não coletamos mais nada além do conteúdo que você mesmo cadastra no plano.<br>
    <b>Base legal:</b> consentimento e legítimo interesse do controlador.<br>
    <b>Armazenamento:</b> servidores no <b>Brasil</b> (Supabase, região São Paulo), com acesso restrito por autenticação e RLS (só usuários aprovados).<br>
    <b>Seus direitos:</b> acessar, exportar e excluir seus dados a qualquer momento.<br>
    <b>Encarregado (DPO):</b> ${esc(ENCARREGADO)}.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
      <button class="btn" onclick="exportData()">⬇ Exportar meus dados</button>
      <button class="btn btn-ghost" style="color:#ff8f8f;border-color:rgba(239,68,68,.4)" onclick="deleteAccount()">Excluir minha conta</button>
    </div>`;
  document.getElementById('modalTitle').textContent='Privacidade & LGPD';
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalSave').style.display='none';
  document.getElementById('modal').classList.add('show');
}
async function deleteAccount(){
  if(!confirm('Excluir sua conta? Você perderá o acesso e seus dados de login serão apagados. (O conteúdo do plano, que é compartilhado, permanece para a equipe.)'))return;
  const {data,error}=await sb.functions.invoke('manage-users',{body:{action:'delete_self'}});
  if(error||(data&&data.error)){toast('⚠ '+((data&&data.error)||error.message));return}
  await sb.auth.signOut();location.reload();
}
function exportData(){const out={exportadoEm:new Date().toISOString(),faixaAtual:DB.faixaAtual,areas:alive(DB.areas),tarefas:alive(DB.tarefas),equipe:alive(DB.equipe),portfolio:alive(DB.portfolio)};
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='plano-bpo-lidere-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Dados exportados')}

/* ===== Efeitos visuais ===== */
function fxAfterRender(){
  document.querySelectorAll('.stat .v').forEach(el=>{const t=parseInt(el.textContent)||0;if(t<=0)return;let s=null;requestAnimationFrame(function step(ts){if(!s)s=ts;const p=Math.min(1,(ts-s)/500);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)})});
  document.querySelectorAll('.pbar').forEach(bar=>{const tg=+bar.dataset.target||0;requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width=tg+'%'));bar.parentElement.classList.toggle('full',tg>=100);
    if(bar.dataset.main){const last=window._pctMain??tg;if(tg>=100&&last<100)confetti();window._pctMain=tg}});
  if(window._justPop){const r=document.querySelector('[data-mid="'+window._justPop+'"]');if(r){r.querySelector('.check')?.classList.add('pop');r.classList.add('flash')}window._justPop=null}
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#d4a840','#f2c94c','#3b82f6','#3ea06b','#a855f7','#fff2b8'];for(let i=0;i<46;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'vw';s.style.background=cols[i%cols.length];s.style.animationDuration=(1+Math.random()*1.2)+'s';s.style.transform='rotate('+Math.random()*360+'deg)';c.appendChild(s)}document.body.appendChild(c);toast('🎉 Tudo concluído!');setTimeout(()=>c.remove(),2700)}

/* ===== GATE / AUTH ===== */
function appRedirect(){return /^https?:/.test(location.protocol)?location.origin+location.pathname:undefined}
function gmsg(m,cls){const e=document.getElementById('gateMsg');if(e){e.textContent=m||'';e.className='gate-msg '+(cls||'')}}
function showApp(v){document.getElementById('app').style.display=v?'':'none';document.getElementById('gate').classList.toggle('show',!v)}
function gateShow(which){
  showApp(false);const B=document.getElementById('gateBody');
  if(which==='login'){B.innerHTML=`<h2>Acesso ao Plano</h2><div class="sub">Entre com o e-mail e senha da sua conta.</div>
    <div class="field"><label>E-mail</label><input id="g_email" type="email" placeholder="voce@empresa.com.br"></div>
    <div class="field"><label>Senha</label><input id="g_pass" type="password" placeholder="••••••••"></div>
    <button class="btn btn-gold btn-block" onclick="doLogin()">Entrar</button>
    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-link"><a onclick="doReset()">Esqueci a senha</a></div>
    <div class="gate-link">Não tem acesso? <a onclick="gateShow('signup')">Solicitar acesso</a></div>`;
    setTimeout(()=>{const e=document.getElementById('g_email');e&&e.focus();const p=document.getElementById('g_pass');p&&p.addEventListener('keydown',ev=>{if(ev.key==='Enter')doLogin()})},50);
  }else if(which==='signup'){B.innerHTML=`<h2>Solicitar acesso</h2><div class="sub">Crie sua conta. Após confirmar o e-mail, um administrador precisa aprovar seu acesso.</div>
    <div class="field"><label>E-mail</label><input id="g_email" type="email" placeholder="voce@empresa.com.br"></div>
    <div class="field"><label>Senha (mín. 8 caracteres)</label><input id="g_pass" type="password" placeholder="••••••••"></div>
    <label class="consent"><input type="checkbox" id="g_consent"> <span>Li e concordo com o <a onclick="gatePriv()">Aviso de Privacidade</a>. Autorizo o uso do meu e-mail para autenticação, conforme a LGPD.</span></label>
    <button class="btn btn-gold btn-block" onclick="doSignup()">Criar conta</button>
    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-link">Já tem conta? <a onclick="gateShow('login')">Entrar</a></div>`;
  }else if(which==='confirm'){B.innerHTML=`<div class="big-emoji">📧</div><h2>Confirme seu e-mail</h2>
    <div class="sub">Enviamos um link de confirmação para o seu e-mail. Clique nele e depois volte aqui para entrar.</div>
    <button class="btn btn-block" onclick="logout()">Voltar ao login</button>`;
  }else if(which==='pending'){B.innerHTML=`<div class="big-emoji">⏳</div><h2>Aguardando aprovação</h2>
    <div class="sub">Sua conta foi criada e confirmada. Um administrador precisa liberar seu acesso ao plano. Você será avisado.</div>
    <button class="btn btn-block" onclick="logout()">Sair</button>`;
  }
}
function gatePriv(){alert('Aviso de Privacidade (LGPD)\n\nControlador: '+CONTROLADOR+'\nFinalidade: autenticar o acesso ao plano interno e registrar o progresso.\nDados coletados: apenas seu e-mail.\nArmazenamento: servidores no Brasil (Supabase - São Paulo), com acesso restrito (RLS, só aprovados).\nDireitos: acessar, exportar e excluir seus dados.\nEncarregado (DPO): '+ENCARREGADO)}
async function doLogin(){const email=val('g_email'),pass=document.getElementById('g_pass').value;if(!email||!pass)return gmsg('Preencha e-mail e senha','err');
  gmsg('Entrando…');const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)return gmsg(traduz(error.message),'err');afterLogin()}
async function doSignup(){const email=val('g_email'),pass=document.getElementById('g_pass').value;
  if(!email||!pass)return gmsg('Preencha e-mail e senha','err');if(pass.length<8)return gmsg('A senha deve ter ao menos 8 caracteres','err');
  if(!document.getElementById('g_consent').checked)return gmsg('É preciso aceitar o Aviso de Privacidade','err');
  gmsg('Criando conta…');const{data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:appRedirect()}});
  if(error)return gmsg(traduz(error.message),'err');
  if(data.session){afterLogin()}else{gateShow('confirm')}}
async function doReset(){const email=val('g_email');if(!email)return gmsg('Digite seu e-mail acima primeiro','err');
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:appRedirect()});gmsg(error?traduz(error.message):'Enviamos um link de redefinição para o seu e-mail.',error?'err':'ok')}
async function logout(){await sb.auth.signOut();ME=null;gateShow('login')}
function traduz(m){m=String(m||'');if(/Invalid login/i.test(m))return'E-mail ou senha incorretos';if(/already registered|already been/i.test(m))return'Este e-mail já tem conta. Faça login.';if(/Email not confirmed/i.test(m))return'Confirme seu e-mail antes de entrar';if(/rate limit|too many/i.test(m))return'Muitas tentativas. Aguarde um instante.';return m}

async function afterLogin(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return gateShow('login');
  if(!user.email_confirmed_at)return gateShow('confirm');
  let {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof){await new Promise(r=>setTimeout(r,800));({data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle())}
  ME={id:user.id,email:user.email,approved:!!(prof&&prof.approved),is_admin:!!(prof&&prof.is_admin)};
  if(!ME.approved)return gateShow('pending');
  showApp(true);await loadAll();render();
}

/* fechar modais */
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ===== BOOT ===== */
initSB();
sb.auth.onAuthStateChange(async (evt)=>{ if(evt==='PASSWORD_RECOVERY'){const p=prompt('Digite a nova senha (mín. 8 caracteres):');if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});toast(error?'⚠ Erro ao trocar senha':'Senha atualizada');afterLogin()}}});
(async()=>{const {data:{session}}=await sb.auth.getSession();session?afterLogin():gateShow('login')})();
</script></body></html>
